services:
  # DynamoDB Local 初期化コンテナ 
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    ports:
      - "8000:8000"
    working_dir: /home/dynamodblocal
    command: -jar DynamoDBLocal.jar -sharedDb -inMemory 
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - trigger-game-network

  # DynamoDB Local に Goでテーブル作成と初期データ投入するコンテナ
  dynamodb-local-initialize:
    build: ./local-dynamodb-initialize
    depends_on:
      - dynamodb-local
    networks:
      - trigger-game-network

  # WebSocket API Gatewayのローカル環境
  websocket-apigateway:
    build:
      context: ./local-websocket-apigateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./local-websocket-apigateway:/app  # ソースコードをマウント
    networks:
      - trigger-game-network

  # EventBridge Schedulerのローカル環境
  eventbridge-scheduler:
    build:
      context: ./local-eventbridge-scheduler
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      LAMBDA_INVOKE_URL: http://game-server:9000/2015-03-31/functions/game_server/invocations
    volumes:
      - ./local-eventbridge-scheduler:/app  # ソースコードをマウント
    networks:
      - trigger-game-network

  # Lambda開発環境（cargo-lambda watch）
  game-server:
    build: ./game_server
    ports:
      - "9000:9000"
    volumes:
      - ./game_server/rust_app/src:/app/src:ro
      - ./machine_learning/models:/opt/models:ro
    environment:
      RUST_BACKTRACE: "full"           # 完全なスタックトレース
      RUST_LOG: "game_server=debug,aws_sdk_dynamodb=debug"  # ログレベル
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      WEBSOCKET_GATEWAY_ENDPOINT: http://websocket-apigateway:8080
      EVENTBRIDGE_SCHEDULER_ENDPOINT: http://eventbridge-scheduler:8081
      EVENTBRIDGE_SCHEDULER_TARGET_ARN: "arn:aws:lambda:us-east-1:123456789012:function:trigger-game-lambda"  # ダミーARN
      EVENTBRIDGE_SCHEDULER_ROLE_ARN: "arn:aws:iam::123456789012:role/trigger-game-scheduler-role"  # ダミーARN
      EVENTBRIDGE_SCHEDULER_GROUP_NAME: "triggergame-motionlab-timer"
    networks:
      - trigger-game-network

  # ゲームクライアント開発環境（Next.js)
  game-client:
    build: ./game-client
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development            # ホットリロードを有効化
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080
    volumes:
      # ソースコードをマウント（ホットリロード用）
      - ./game-client:/app:cached
      # node_modules は除外（コンテナ内のものを使用）
      - /app/node_modules
      # .next も除外（ビルドキャッシュ）
      - /app/.next
    networks:
      - trigger-game-network
    depends_on:
      - websocket-apigateway

networks:
  trigger-game-network:

volumes:
  # dynamodb-local のデータ永続化用ボリューム
  dynamodb-data: